services:
  backend:
    build: ./backend
    container_name: dronefood-backend
    env_file:
      - ./backend/.env
    ports:
      - "4000:4000"
    restart: unless-stopped

  user:
    build:
      context: .
      dockerfile: user/Dockerfile
    container_name: dronefood-user
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

  admin:
    build:
      context: .
      dockerfile: admin/Dockerfile
    container_name: dronefood-admin
    ports:
      - "5174:80"
    depends_on:
      - backend
    restart: unless-stopped

  restaurant:
    build:
      context: .
      dockerfile: restaurant/Dockerfile
    container_name: dronefood-restaurant
    ports:
      - "5175:80"
    depends_on:
      - backend
    restart: unless-stopped
