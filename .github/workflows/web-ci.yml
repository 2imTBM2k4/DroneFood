name: Web CI

on:
  pull_request:
    paths:
      - "apps/customer-web/**"
      - "apps/admin-web/**"
      - "apps/restaurant-web/**"
      - "packages/web-ui/**"
      - "package.json"
      - ".nvmrc"
      - ".github/workflows/web-ci.yml"
  push:
    paths:
      - "apps/customer-web/**"
      - "apps/admin-web/**"
      - "apps/restaurant-web/**"
      - "packages/web-ui/**"
      - "package.json"
      - ".nvmrc"
      - ".github/workflows/web-ci.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [apps/customer-web, apps/admin-web, apps/restaurant-web]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
