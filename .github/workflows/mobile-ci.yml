name: Mobile CI

on:
  pull_request:
    paths:
      - "apps/customer-mobile/**"
      - "apps/restaurant-mobile/**"
      - "apps/shipper-mobile/**"
      - "packages/contracts/**"
      - "packages/api-client/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.base.json"
      - ".nvmrc"
      - ".github/workflows/mobile-ci.yml"
  push:
    paths:
      - "apps/customer-mobile/**"
      - "apps/restaurant-mobile/**"
      - "apps/shipper-mobile/**"
      - "packages/contracts/**"
      - "packages/api-client/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.base.json"
      - ".nvmrc"
      - ".github/workflows/mobile-ci.yml"

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run mobile:typecheck
  android-export:
    needs: typecheck
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ["@drone-food/customer-mobile", "@drone-food/shipper-mobile", "@drone-food/restaurant-mobile"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run export:android --workspace=${{ matrix.app }}
