name: Backend CI

on:
  pull_request:
    paths:
      - "apps/api/**"
      - "packages/web-ui/**"
      - "package.json"
      - ".nvmrc"
      - ".github/workflows/backend-ci.yml"
  push:
    paths:
      - "apps/api/**"
      - "packages/web-ui/**"
      - "package.json"
      - ".nvmrc"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:coverage
