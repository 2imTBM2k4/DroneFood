name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - "shared/**"
      - "package.json"
      - ".github/workflows/backend-ci.yml"
  push:
    paths:
      - "backend/**"
      - "shared/**"
      - "package.json"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:coverage
